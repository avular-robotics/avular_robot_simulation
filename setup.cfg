[metadata]
description = Combined Gazebo simulation package for Avular Origin and Vertex
maintainer = Avular Robotics
maintainer_email = info@avular.com
license = proprietary

[options]
zip_safe = False
include_package_data = False
install_requires =
    rclpy
    xacro

[options.entry_points]
console_scripts =
    robot_specifics = avular_simulations.origin_specifics:main

[develop]
script_dir = $base/lib/avular_simulations

[install]
install_scripts = $base/lib/avular_simulations
