# gz topic published by the simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# gz topic published by SceneBroadcaster plugin
- ros_topic_name: "/tf"
  gz_topic_name: "/robot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# gz topic subscribed by DiffDrive / MecanumDrive plugin
- ros_topic_name: "/robot/cmd_vel"
  gz_topic_name: "/robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  subscriber_queue: 5
  publisher_queue: 6
  lazy: true
  direction:
    ROS_TO_GZ

# gz topic published by DiffDrive / MecanumDrive plugin
- ros_topic_name: "/robot/odom"
  gz_topic_name: "/robot/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  subscriber_queue: 5
  publisher_queue: 6
  lazy: true
  direction:
    GZ_TO_ROS

# gz topic published by NavSat plugin
- ros_topic_name: "/robot/gnss/fix"
  gz_topic_name: "/robot/gnss"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  subscriber_queue: 5
  publisher_queue: 6
  lazy: true
  direction:
    GZ_TO_ROS

# gz topic published by RGBD camera plugin (RealSense D435)
- ros_topic_name: "/robot/camera/color/camera_info"
  gz_topic_name: "/robot/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# duplicate camera_info topic to mimic the real Realsense driver on the origin
- ros_topic_name: "/robot/camera/depth/camera_info"
  gz_topic_name: "/robot/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot/camera/color/image_raw"
  gz_topic_name: "/robot/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true
  direction:
    GZ_TO_ROS

- ros_topic_name: "/robot/camera/depth/image_raw"
  gz_topic_name: "/robot/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true
  direction:
    GZ_TO_ROS

# The rgbd_camera sensor also emits a depth pointcloud on gz /robot/camera/points,
# but it is deliberately NOT bridged: the real Origin does not expose one

# gz topic published by GPU Lidar plugin (Ouster OS1, 32-beam)
- ros_topic_name: "/robot/lidar/points"
  gz_topic_name: "/robot/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true
  direction:
    GZ_TO_ROS

# gz topic published by the Ouster OS1-32 built-in IMU sensor
- ros_topic_name: "/robot/lidar/imu"
  gz_topic_name: "/robot/lidar/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true
  direction:
    GZ_TO_ROS

# gz topic published by JointStatePublisher plugin. Required so RSP can
# resolve TFs for the wheel joints.
- ros_topic_name: "/robot/joint_states"
  gz_topic_name: "/robot/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true
  direction:
    GZ_TO_ROS
