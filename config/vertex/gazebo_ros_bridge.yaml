# gz topic published by the simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# gz topic published by JointStatePublisher plugin. Required so RSP can
# resolve TFs for the four revolute rotor joints.
- ros_topic_name: "/robot/joint_states"
  gz_topic_name: "/robot/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true
  direction: GZ_TO_ROS


# gz topic subscribed by MulticopterVelocityControl plugin
- ros_topic_name: "/robot/cmd_vel"
  gz_topic_name: "/robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  subscriber_queue: 5 # Default 10
  publisher_queue: 6 # Default 10
  lazy: false # Default "false"
  direction:
    ROS_TO_GZ # Default "BIDIRECTIONAL" - Bridge both directions
    # "GZ_TO_ROS" - Bridge Gz topic to ROS
    # "ROS_TO_GZ" - Bridge ROS topic to Gz

